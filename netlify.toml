# Netlify build settings for this static Vite site.
# Set VITE_APP_URL and VITE_SITE_URL under Site configuration > Environment variables if needed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted build output can be cached for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
